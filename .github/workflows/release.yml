name: Release
on:
  push:
    tags:
      - v*

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_tag:
    name: Extract tag name
    runs-on: 'ubuntu-latest'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build:
    name: Build
    runs-on: 'ubuntu-latest'
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk mihon_C-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk mihon_C-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk mihon_C-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86-release.apk mihon_C-x86-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk mihon_C-x86_64-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mihon_C
          path: |
            mihon_C-${{ needs.get_tag.outputs.tag }}.apk
            mihon_C-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            mihon_C-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            mihon_C-x86-${{ needs.get_tag.outputs.tag }}.apk
            mihon_C-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [get_tag, build]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          failOnError: false
          name: mihon_C

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Mihon_C ${{ needs.get_tag.outputs.tag }}
          body: |
            ## Mihon_C - 自定义修改版
            
            基于 Mihon 的自定义版本，包含以下功能：
            
            ### v0.2 功能
            - ✅ 支持打开失效图源的本地完整章节
            - ✅ 自动验证并标记本地完整章节
            - ✅ 优化已下载章节的下载按钮交互
            - ✅ 已下载章节显示 ✅ 图标，点击无响应
            - ✅ 长按已下载章节弹出菜单（删除、重新下载）
            
            > [!TIP]
            > ### 如果不确定下载哪个版本，请选择 `mihon_C-${{ needs.get_tag.outputs.tag }}.apk`（通用版本）
            >
            > - **arm64-v8a**: 适用于大多数现代 Android 设备
            > - **armeabi-v7a**: 适用于旧版 32 位设备
            > - **x86/x86_64**: 适用于模拟器或特殊设备
          files: |
            mihon_C-${{ needs.get_tag.outputs.tag }}.apk
            mihon_C-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            mihon_C-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            mihon_C-x86-${{ needs.get_tag.outputs.tag }}.apk
            mihon_C-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          draft: false
          prerelease: false
